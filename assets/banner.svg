<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="100%" role="img" aria-label="sd-forge-model-manager banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>

    <radialGradient id="spot1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spot2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#273449" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(148,163,184,0.12)" />
    </pattern>

    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="270" rx="14" fill="url(#bg)" />
  <rect width="860" height="270" rx="14" fill="url(#dots)" />
  <rect width="860" height="270" rx="14" fill="url(#spot1)" />
  <rect width="860" height="270" rx="14" fill="url(#spot2)" />
  <rect x="0.5" y="0.5" width="859" height="269" rx="13.5" fill="none" stroke="rgba(255,255,255,0.09)" />
  <rect x="44" y="0" width="772" height="2.5" rx="1.25" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Left Column: Brand & Copy (Safe zone x: 44..486, y: 28..242) -->
  <g transform="translate(44, 30)">
    <!-- Monospace Repo Tag -->
    <rect x="0" y="0" width="218" height="26" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="25" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">SD WEBUI FORGE NEO EXTENSION</text>

    <!-- Main Heading -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.8">Model Manager</text>

    <!-- Subtitle -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#e2e8f0">Metadata, previews &amp; smart organization</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8">for Checkpoints and LoRAs in WebUI Forge Neo.</text>

    <!-- Bottom Capability Row -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="128" height="30" rx="7" fill="rgba(15,23,42,0.9)" stroke="rgba(56,189,248,0.45)" stroke-width="1" />
      <text x="64" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">Civitai + Arcenciel</text>

      <rect x="138" y="0" width="124" height="30" rx="7" fill="rgba(15,23,42,0.9)" stroke="rgba(129,140,248,0.45)" stroke-width="1" />
      <text x="200" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">SHA-256 / AutoV1</text>

      <rect x="272" y="0" width="124" height="30" rx="7" fill="rgba(15,23,42,0.9)" stroke="rgba(232,121,249,0.45)" stroke-width="1" />
      <text x="334" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">LoRA Auto-Sort</text>
    </g>
  </g>

  <!-- Right Column: Toolbar + Dual Cards Preview (Safe zone x: 510..816, y: 24..246) -->
  <g transform="translate(510, 24)">
    <!-- Mini Extra Networks Toolbar -->
    <rect x="0" y="0" width="306" height="34" rx="8" fill="rgba(15,23,42,0.92)" stroke="rgba(255,255,255,0.14)" stroke-width="1" filter="url(#shadow)" />
    <!-- Filter dropdown -->
    <rect x="8" y="6" width="114" height="22" rx="5" fill="#1e293b" stroke="rgba(148,163,184,0.3)" stroke-width="1" />
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">All Base Models</text>
    <path d="M 108 15 L 112 19 L 116 15" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Favorites button -->
    <rect x="130" y="6" width="84" height="22" rx="5" fill="rgba(234,179,8,0.16)" stroke="rgba(234,179,8,0.55)" stroke-width="1" />
    <path d="M 142 12 L 143.3 15 L 146.5 15.4 L 144.2 17.6 L 144.8 20.8 L 142 19.2 L 139.2 20.8 L 139.8 17.6 L 137.5 15.4 L 140.7 15 Z" fill="#facc15" />
    <text x="152" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fef08a">Favorites</text>
    <!-- Scan button -->
    <rect x="222" y="6" width="76" height="22" rx="5" fill="rgba(56,189,248,0.18)" stroke="rgba(56,189,248,0.5)" stroke-width="1" />
    <circle cx="235" cy="16" r="3.8" fill="none" stroke="#7dd3fc" stroke-width="1.5" />
    <line x1="238" y1="19" x2="241" y2="22" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" />
    <text x="248" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">Scan</text>

    <!-- Back Card (Flux.1 D) -->
    <g transform="translate(8, 48)">
      <rect width="144" height="172" rx="10" fill="url(#cardBack)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)" />
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 134 0 C 139.5 0 144 4.5 144 10 L 144 116 L 0 116 Z" fill="#172554" opacity="0.6" />
      <circle cx="72" cy="54" r="24" fill="#38bdf8" opacity="0.22" />
      <path d="M 16 116 L 56 76 L 96 116 Z" fill="#1e293b" opacity="0.9" />
      <path d="M 64 116 L 104 82 L 136 116 Z" fill="#0f172a" opacity="0.95" />
      <rect x="8" y="8" width="58" height="19" rx="4" fill="#0284c7" />
      <text x="37" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Flux.1 D</text>
      <text x="10" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Anime Style</text>
      <rect x="10" y="146" width="38" height="17" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8" />
      <text x="29" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">v2.0</text>
    </g>

    <!-- Front Card (SDXL 1.0) -->
    <g transform="translate(148, 44)">
      <rect width="158" height="178" rx="10" fill="url(#cardFront)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" filter="url(#shadow)" />
      <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 148 0 C 153.5 0 158 4.5 158 10 L 158 120 L 0 120 Z" fill="#312e81" opacity="0.6" />
      <circle cx="79" cy="52" r="28" fill="url(#accentGrad)" opacity="0.28" />
      <path d="M 18 120 C 42 80 68 68 82 68 C 96 68 122 80 144 120 Z" fill="#4338ca" opacity="0.65" />
      <path d="M 10 120 L 54 84 L 98 120 Z" fill="#1e293b" opacity="0.92" />
      <path d="M 76 120 L 116 88 L 150 120 Z" fill="#0f172a" opacity="0.95" />

      <!-- Top Badges -->
      <rect x="8" y="8" width="64" height="20" rx="4" fill="#4f46e5" />
      <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">SDXL 1.0</text>
      <rect x="77" y="8" width="22" height="20" rx="4" fill="rgba(15,23,42,0.9)" stroke="#eab308" stroke-width="1" />
      <path d="M 88 12.5 L 89.6 15.8 L 93.2 16.3 L 90.6 18.8 L 91.2 22.3 L 88 20.6 L 84.8 22.3 L 85.4 18.8 L 82.8 16.3 L 86.4 15.8 Z" fill="#facc15" />

      <!-- Card Footer -->
      <text x="10" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Cyber Realistic</text>
      <rect x="10" y="150" width="40" height="18" rx="4" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.22)" stroke-width="0.9" />
      <text x="30" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">v4.2</text>
    </g>
  </g>
</svg>
